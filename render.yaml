services:
  - type: web
    name: tasar-silkworm-disease-predictor
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: app
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Optional: sign up free at https://open-meteo.com/en/pricing and paste key here.
      # - key: OPEN_METEO_API_KEY
      #   value: "YOUR_OPEN_METEO_API_KEY"
